; WT32-SC01 (V3.2) — web image server (128x128 RGB565, scaled to the panel)
; https://github.com/luckyluckhcccp/wt32-sc01-v3.2-LVGL8-lovyan-gfx
;
; The reference board is a classic ESP32 (WROVER) driving a 320x480 ST7796 SPI
; panel with FT5x06 touch. LovyanGFX handles the display; see include/lgfx_wt32.h.

[env:wt32-sc01]
platform = espressif32@^6.5.0
board = esp-wrover-kit          ; ESP32 WROVER (PSRAM module), 4 MB flash
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; ../common holds names_discovery.h + overlay.h, shared by both firmwares.
build_flags =
    -I $PROJECT_DIR/../common
    -DCORE_DEBUG_LEVEL=1
    -DLGFX_USE_V1
    -DBOARD_HAS_PSRAM          ; the 300 KB full-screen frame buffer lives in PSRAM

; Custom no-OTA layout (see partitions.csv): a large LittleFS partition holds the
; 4 full-screen raw slots (~1.2 MB) plus the hotspot config, restored on boot.
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

lib_deps =
    lovyan03/LovyanGFX@^1.1.12
